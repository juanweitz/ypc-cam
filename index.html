<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YPC Camera</title>
<meta name="theme-color" content="#161b22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="YPC Cam">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%233ea6ff'/%3E%3Ccircle cx='8' cy='8' r='3' fill='%230d1117'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="dot" id="dot"></span>
    <h1>YPC Camera</h1>
    <span class="host" id="hostLabel">—</span>
  </div>
  <div class="top-actions">
    <button class="btn ghost" id="btnInstall" hidden>Install</button>
    <button class="btn ghost" id="btnFull" title="View full screen">Fullscreen</button>
    <button class="btn" id="btnReconnect">Reconnect</button>
  </div>
</header>

<main class="layout">
  <section class="stage">
    <div class="viewport" id="viewport">
      <video id="usb" playsinline muted autoplay hidden></video>
      <canvas id="canvas" width="1280" height="720"></canvas>
      <div class="overlay" id="overlay">
        <div class="spinner"></div>
        <p id="overlayText">Starting…</p>
      </div>
      <div class="badge" id="modeBadge" hidden>USB</div>
      <div class="rec-dot" id="recDot" hidden>REC</div>
    </div>
    <div class="stagebar">
      <div class="stat"><span id="fps">0</span> fps</div>
      <div class="stat" id="resStat">–</div>
      <div class="spacer"></div>
      <button class="btn ghost" id="btnSnap" title="Save a still">Snapshot</button>
      <button class="btn ghost" id="btnRec" title="Record video">Record</button>
    </div>
  </section>

  <aside class="panel">
    <div class="pane">
      <div class="group">
        <h2>Camera</h2>
        <label class="row">
          <span>Device</span>
          <select id="usbDevice"></select>
        </label>
        <label class="row">
          <span>Frame size</span>
          <select id="usbSize">
            <option value="640x480">640 × 480</option>
            <option value="1280x720">1280 × 720</option>
            <option value="1280x960">1280 × 960</option>
          </select>
        </label>
        <button class="btn wide" id="btnRescan">Rescan devices</button>
        <p class="hint">The camera must be plugged in by USB. Browsers only allow camera access on
          <code>http://localhost:8000</code>, not on <code>file://</code>.</p>
      </div>

      <div class="group">
        <h2>Log</h2>
        <pre class="raw log" id="log"></pre>
      </div>
    </div>
  </aside>
</main>

<script src="app.js"></script>
</body>
</html>
